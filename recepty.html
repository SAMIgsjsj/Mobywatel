<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiI2Y1ZjZmYiIsImJhY2tncm91bmRfY29sb3IiOiIjZjVmNmZiIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/logo.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #f6f7fb;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        .rx_topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: grid;
            grid-template-columns: 96px 1fr 96px;
            align-items: center;
            padding: 16px 14px 12px;
            background-color: #f6f7fb;
        }

        .rx_back_btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border: none;
            background: transparent;
            color: #1665e3;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 2px;
            justify-self: start;
        }

        .rx_back_btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .rx_header_title {
            margin: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }

        .rx_main {
            max-width: 460px;
            margin: 0 auto;
            padding: 10px 18px 128px;
            box-sizing: border-box;
        }

        .rx_hero_icon {
            width: 74px;
            height: 74px;
            border-radius: 50%;
            background-color: #dcf3fa;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px auto 20px;
        }

        .rx_hero_icon svg {
            width: 38px;
            height: 38px;
        }

        .rx_hero_title {
            margin: 0 0 10px;
            font-size: 31px;
            line-height: 1.15;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .rx_hero_desc {
            margin: 0 0 24px;
            font-size: 15px;
            line-height: 1.45;
            color: #525866;
        }

        .rx_quick_grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .rx_quick_btn {
            border: none;
            background: transparent;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 8px;
            cursor: pointer;
            color: #1f2937;
        }

        .rx_quick_circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #ffffff;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1665e3;
        }

        .rx_quick_circle svg {
            width: 22px;
            height: 22px;
        }

        .rx_quick_label {
            margin: 0;
            font-size: 13px;
            line-height: 1.28;
            font-weight: 500;
            color: #374151;
        }

        .rx_section_heading {
            margin: 0 0 12px;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
        }

        .rx_list_card {
            background-color: #ffffff;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }

        .rx_empty_tag {
            display: inline-block;
            font-size: 12.5px;
            font-weight: 700;
            color: #0b4da2;
            margin-bottom: 6px;
        }

        .rx_empty_title {
            margin: 0 0 6px;
            font-size: 16.5px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
        }

        .rx_empty_desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.48;
            color: #525866;
        }

        .rx_notice_box {
            display: none;
            margin-top: 14px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            border-left: 4px solid #1665e3;
            font-size: 13.5px;
            line-height: 1.48;
            color: #374151;
        }

        .rx_notice_box.open {
            display: block;
        }
    </style>
</head>
<body>
    <header class="rx_topbar">
        <button type="button" class="rx_back_btn" onclick="sendTo('services')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>Wróć</span>
        </button>
        <h1 class="rx_header_title">Recepty</h1>
        <span></span>
    </header>

    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services services_open"></div>
                <p class="bottom_element_text open">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <main class="rx_main">
        <div class="rx_hero_icon" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none">
                <rect x="7" y="10" width="26" height="20" rx="4" fill="#38bdf8"/>
                <rect x="23" y="16" width="12" height="8" rx="2.5" fill="#0284c7"/>
                <circle cx="27" cy="20" r="1.8" fill="#e0f2fe"/>
            </svg>
        </div>

        <h2 class="rx_hero_title">Zarządzaj swoimi<br>receptami</h2>
        <p class="rx_hero_desc">Sprawdzaj status recept przypisanych do Twojego konta w jednym miejscu.</p>

        <div class="rx_quick_grid">
            <button type="button" class="rx_quick_btn" onclick="showRxNotice('Sprawdzanie aktywnych recept: na Twoim koncie nie ma obecnie żadnych wystawionych recept.')">
                <span class="rx_quick_circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="4" y="4" width="16" height="16" rx="3"></rect>
                        <line x1="8" y1="10" x2="16" y2="10"></line>
                        <line x1="8" y1="14" x2="13" y2="14"></line>
                    </svg>
                </span>
                <p class="rx_quick_label">Aktywne<br>recepty</p>
            </button>

            <button type="button" class="rx_quick_btn" onclick="showRxNotice('Historia recept jest obecnie pusta — brak zrealizowanych lub archiwalnych recept.')">
                <span class="rx_quick_circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <polyline points="12 7 12 12 15.5 14"></polyline>
                    </svg>
                </span>
                <p class="rx_quick_label">Historia<br>recept</p>
            </button>

            <button type="button" class="rx_quick_btn" onclick="showRxNotice('W tym widoku pojawiają się recepty przypisane do Twojego konta. Gdy brak recept, lista pozostaje pusta.')">
                <span class="rx_quick_circle" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"></circle>
                        <line x1="12" y1="11" x2="12" y2="16"></line>
                        <circle cx="12" cy="7.5" r="0.8" fill="currentColor"></circle>
                    </svg>
                </span>
                <p class="rx_quick_label">Informacje<br>o koncie</p>
            </button>
        </div>

        <h3 class="rx_section_heading">Twoje recepty</h3>

        <section class="rx_list_card">
            <span class="rx_empty_tag">Stan konta: 0 recept</span>
            <h4 class="rx_empty_title">Brak recept przypisanych do Twojego konta</h4>
            <p class="rx_empty_desc">
                Obecnie nie ma żadnych recept przypisanych do Twojego konta.
            </p>
        </section>

        <div class="rx_notice_box" id="rxNoticeBox"></div>
    </main>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }

        function showRxNotice(message) {
            const box = document.getElementById('rxNoticeBox');
            box.textContent = message;
            box.classList.add('open');
        }
    </script>
</body>
</html>
