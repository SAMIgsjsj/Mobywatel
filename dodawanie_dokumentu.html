    <style>
        html,
        body {
            background-color: #f5f6fa !important;
            margin: 0;
            padding: 0;
        }

        .add_header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 68px;
            padding-top: 10px;
            background-color: #f5f6fa;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 40;
            box-sizing: border-box;
        }

        .add_header_title {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
            color: #1c1e21;
            text-align: center;
        }

        .add_close_btn {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-25%);
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #1665e3;
            font-size: 24px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .add_doc_container {
            padding: 82px 16px 40px !important;
            max-width: 540px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .add_doc_list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .add_doc_item {
            width: 100%;
            min-height: 68px;
            border: none;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 16px 18px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            cursor: pointer;
            text-align: left;
            box-sizing: border-box;
            transition: transform 0.12s ease, background-color 0.12s ease;
        }

        .add_doc_item:active {
            transform: scale(0.99);
            background-color: #f9fafb;
        }

        .add_doc_item_left {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            flex: 1;
        }

        .add_doc_icon_box {
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .add_doc_icon_box svg {
            width: 28px;
            height: 28px;
            display: block;
        }

        .add_doc_name {
            margin: 0;
            font-size: 16.5px;
            font-weight: 500;
            line-height: 1.3;
            color: #1f2125;
        }

        .add_doc_chevron {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #374151;
            flex-shrink: 0;
        }

        .add_doc_card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            box-sizing: border-box;
        }

        .add_doc_step_badge {
            display: inline-block;
            background-color: #e8f0fe;
            color: #1665e3;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        .add_doc_card_title {
            margin: 0 0 8px;
            font-size: 18px;
            font-weight: 700;
            color: #1f2125;
        }

        .add_doc_card_text {
            margin: 0 0 14px;
            font-size: 14px;
            line-height: 1.5;
            color: #4b5563;
        }

        .add_doc_progress_track {
            width: 100%;
            height: 8px;
            background-color: #e5e7eb;
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 14px;
        }

        .add_doc_progress_bar {
            width: 0%;
            height: 100%;
            background-color: #1665e3;
            transition: width 0.35s ease;
        }

        .add_doc_summary {
            background-color: #f8fafc;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 16px;
            font-size: 13.5px;
            line-height: 1.5;
            color: #1f2937;
        }

        .add_doc_actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .add_doc_primary_btn {
            width: 100%;
            border: none;
            background-color: #1665e3;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            padding: 14px 16px;
            border-radius: 12px;
            cursor: pointer;
        }

        .add_doc_secondary_btn {
            width: 100%;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            color: #1f2125;
            font-size: 14.5px;
            font-weight: 600;
            padding: 13px 16px;
            border-radius: 12px;
            cursor: pointer;
        }

        .add_doc_hidden {
            display: none !important;
        }
    </style>
</head>

    <script>
        const DOC_CONFIG = {
            emeryt: {
                name: 'Legitymacja emeryta-rencisty',
                registry: 'Zakład Ubezpieczeń Społecznych (ZUS)',
                targetPage: 'documents'
            },
            poselska: {
                name: 'Legitymacja poselska',
                registry: 'Kancelaria Sejmu RP',
                targetPage: 'documents'
            },
            adwokacka: {
                name: 'Legitymacja adwokacka',
                registry: 'Naczelna Rada Adwokacka',
                targetPage: 'documents'
            },
            prawo_jazdy: {
                name: 'mPrawo jazdy',
                registry: 'Centralna Ewidencja Kierowców (CEPiK)',
                targetPage: 'prawo_jazdy'
            },
            kdr: {
                name: 'Karta Dużej Rodziny',
                registry: 'Rejestr Karty Dużej Rodziny',
                targetPage: 'documents'
            },
            szkolna: {
                name: 'Legitymacja szkolna',
                registry: 'System Informacji Oświatowej',
                targetPage: 'card'
            },
            studencka: {
                name: 'Legitymacja studencka',
                registry: 'Zintegrowany System Informacji o Szkolnictwie Wyższym',
                targetPage: 'documents'
            },
            luut: {
                name: 'Legitymacja Ulgowych Usług Transportowych',
                registry: 'Rejestr Uprawnień Przewozowych',
                targetPage: 'documents'
            },
            dowod: {
                name: 'mDowód',
                registry: 'Rejestr Dowodów Osobistych / PESEL',
                targetPage: 'card'
            }
        };

        let activeDocKey = null;

        function sendTo(page) {
            const currentParams = new URLSearchParams(window.location.search);
            const query = currentParams.toString();
            location.href = query ? `${page}.html?${query}` : `${page}.html`;
        }

        function handleCloseClick() {
            const verifyVisible = !document.getElementById('stepVerifyDoc').classList.contains('add_doc_hidden');
            const doneVisible = !document.getElementById('stepDoneDoc').classList.contains('add_doc_hidden');
            if (verifyVisible || doneVisible) {
                resetDocFlow();
            } else {
                sendTo('home');
            }
        }

        function getProfilePreview() {
            try {
                const raw = localStorage.getItem('mobywatel_profile_data');
                if (!raw) return null;
                return JSON.parse(raw);
            } catch (e) {
                return null;
            }
        }

        function startDocFlow(docKey) {
            const cfg = DOC_CONFIG[docKey];
            if (!cfg) return;
            activeDocKey = docKey;

            document.getElementById('stepSelectDoc').classList.add('add_doc_hidden');
            document.getElementById('stepDoneDoc').classList.add('add_doc_hidden');
            document.getElementById('stepVerifyDoc').classList.remove('add_doc_hidden');

            document.getElementById('verifyBadge').textContent = 'Krok 1 z 2 • Sprawdzanie rejestru';
            document.getElementById('verifyTitle').textContent = `Dodawanie: ${cfg.name}`;
            document.getElementById('verifyStatusText').textContent = `Trwa sprawdzanie uprawnień w: ${cfg.registry}...`;

            const bar = document.getElementById('verifyProgressBar');
            bar.style.width = '25%';

            const profile = getProfilePreview();
            const fullName = profile && (profile.name || profile.surname)
                ? `${profile.name || ''} ${profile.surname || ''}`.trim()
                : 'Użytkownik profilu';

            document.getElementById('verifySummary').innerHTML =
                `<strong>Dokument:</strong> ${cfg.name}<br>` +
                `<strong>Rejestr:</strong> ${cfg.registry}<br>` +
                `<strong>Posiadacz:</strong> ${fullName}`;

            setTimeout(() => {
                bar.style.width = '75%';
                document.getElementById('verifyBadge').textContent = 'Krok 2 z 2 • Potwierdzenie dodania';
                document.getElementById('verifyStatusText').textContent = 'Dane zostały odnalezione. Potwierdź, aby dodać dokument do aplikacji.';
            }, 450);
        }

        function resetDocFlow() {
            activeDocKey = null;
            document.getElementById('stepVerifyDoc').classList.add('add_doc_hidden');
            document.getElementById('stepDoneDoc').classList.add('add_doc_hidden');
            document.getElementById('stepSelectDoc').classList.remove('add_doc_hidden');
            document.getElementById('verifyProgressBar').style.width = '0%';
        }

        function completeAddingDoc() {
            const cfg = DOC_CONFIG[activeDocKey];
            if (!cfg) return;

            document.getElementById('verifyProgressBar').style.width = '100%';

            try {
                const rawList = localStorage.getItem('mobywatel_added_docs');
                const parsed = rawList ? JSON.parse(rawList) : [];
                const list = Array.isArray(parsed) ? parsed : [];
                if (!list.includes(activeDocKey)) {
                    list.push(activeDocKey);
                    localStorage.setItem('mobywatel_added_docs', JSON.stringify(list));
                }
            } catch (e) {}

            document.getElementById('stepVerifyDoc').classList.add('add_doc_hidden');
            document.getElementById('stepDoneDoc').classList.remove('add_doc_hidden');
            document.getElementById('doneTitle').textContent = `Dodano: ${cfg.name}`;
            document.getElementById('doneText').textContent =
                `Dokument ${cfg.name} został pomyślnie pobrany z rejestru i zapisany w Twoim profilu.`;
        }

        function openTargetDoc() {
            const cfg = DOC_CONFIG[activeDocKey];
            if (!cfg) {
                sendTo('home');
                return;
            }
            sendTo(cfg.targetPage);
        }
    </script>
</body>
</html>
