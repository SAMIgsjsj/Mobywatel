    <style>
        body {
            background-color: #f5f6fb;
            color: #111827;
            margin: 0;
        }

        .help_header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 18px 14px;
            background-color: #f5f6fb;
        }

        .help_back_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
        }

        .help_back_btn:active {
            background-color: rgba(17, 24, 39, 0.06);
        }

        .help_title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.2px;
        }

        .help_container {
            padding: 10px 16px 120px;
        }

        .help_card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 20px 18px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        }

        .help_text {
            margin: 0;
            font-size: 15.5px;
            color: #1f2937;
            line-height: 1.6;
        }

        .help_link {
            color: #1d4ed8;
            font-weight: 600;
            text-decoration: none;
        }

        .help_link:active {
            text-decoration: underline;
        }

    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">

                <p class="bottom_element_text">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more more_open"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </div>

    <header class="help_header">
        <button type="button" class="help_back_btn" onclick="sendTo('more')" aria-label="Wróć">←</button>
        <h1 class="help_title">Pomoc techniczna</h1>
    </header>

    <main class="help_container">
        <div class="help_card">
            <p class="help_text">
                Pomoc techniczna aplikacji mObywatel jest dostępna pod numerem telefonu
                <a class="help_link" href="tel:+48422535474">+48 42 253 54 74</a>
                oraz adresem e-mail
                <a class="help_link" href="mailto:mobywatel-pomoc@coi.gov.pl">mobywatel-pomoc@coi.gov.pl</a>
                w dni robocze w godzinach 7:00–18:00. Więcej informacji znajdziesz na oficjalnym portalu mObywatel.
            </p>
        </div>
    </main>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }
    </script>
