<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiI2Y1ZjZmYiIsImJhY2tncm91bmRfY29sb3IiOiIjZjVmNmZiIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/logo.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #f6f7fb;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        .safe_view {
            display: none;
        }

        .safe_view.active {
            display: block;
        }

        .safe_topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: grid;
            grid-template-columns: 128px 1fr 128px;
            align-items: center;
            padding: 16px 14px 12px;
            background-color: #f6f7fb;
        }

        .safe_back_btn {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            border: none;
            background: transparent;
            color: #1665e3;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 2px;
            justify-self: start;
            white-space: nowrap;
        }

        .safe_back_btn svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .safe_header_title {
            margin: 0;
            text-align: center;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
        }

        .safe_main {
            min-height: calc(100vh - 145px);
            max-width: 460px;
            margin: 0 auto;
            padding: 14px 18px 124px;
            box-sizing: border-box;
        }

        .safe_hero_icon {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background-color: #f8e3ea;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 6px auto 22px;
        }

        .safe_hero_icon svg {
            width: 40px;
            height: 40px;
        }

        .safe_hero_heading {
            margin: 0 0 10px;
            font-size: 31px;
            line-height: 1.16;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #111827;
        }

        .safe_hero_subtitle {
            margin: 0 0 24px;
            font-size: 15.5px;
            line-height: 1.45;
            color: #525866;
        }

        .safe_action_card {
            width: 100%;
            border: none;
            background-color: #ffffff;
            border-radius: 18px;
            padding: 18px 18px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
            display: grid;
            grid-template-columns: 28px 1fr 18px;
            align-items: center;
            gap: 14px;
            text-align: left;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .safe_action_card:active {
            background-color: #f8fafc;
        }

        .safe_plane_icon {
            width: 24px;
            height: 24px;
            color: #374151;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .safe_plane_icon svg {
            width: 22px;
            height: 22px;
        }

        .safe_action_title {
            margin: 0 0 4px;
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
        }

        .safe_action_desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            color: #525866;
        }

        .safe_chevron {
            color: #6b7280;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .safe_chevron svg {
            width: 16px;
            height: 16px;
        }

        .safe_info_banner {
            background-color: #dbeafe;
            border-radius: 18px;
            padding: 18px 18px;
            display: grid;
            grid-template-columns: 26px 1fr;
            gap: 12px;
            align-items: start;
        }

        .safe_info_icon {
            width: 24px;
            height: 24px;
            color: #1665e3;
            margin-top: 1px;
        }

        .safe_info_icon svg {
            width: 24px;
            height: 24px;
        }

        .safe_info_text {
            margin: 0 0 10px;
            font-size: 15px;
            line-height: 1.42;
            color: #1f2937;
        }

        .safe_link_btn {
            border: none;
            background: transparent;
            padding: 0;
            color: #1665e3;
            font-size: 15px;
            font-weight: 500;
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
        }

        .safe_status_msg {
            display: none;
            margin-top: 14px;
            background-color: #ffffff;
            border-radius: 14px;
            padding: 12px 15px;
            font-size: 13.5px;
            line-height: 1.45;
            color: #374151;
            border-left: 4px solid #1665e3;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
        }

        .safe_status_msg.open {
            display: block;
        }

        /* Widok 2: Wybierz rodzaj incydentu */
        .incident_list_heading {
            margin: 10px 0 18px;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .incident_card {
            background-color: #ffffff;
            border-radius: 18px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
            overflow: hidden;
        }

        .incident_item {
            width: 100%;
            border: none;
            background: #ffffff;
            padding: 18px 18px;
            display: grid;
            grid-template-columns: 1fr 18px;
            align-items: center;
            gap: 12px;
            text-align: left;
            cursor: pointer;
        }

        .incident_item:active {
            background-color: #f8fafc;
        }

        .incident_item + .incident_item {
            border-top: 1px solid #eef0f5;
        }

        .incident_title {
            margin: 0 0 4px;
            font-size: 16.5px;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
        }

        .incident_desc {
            margin: 0;
            font-size: 14px;
            line-height: 1.4;
            color: #525866;
        }
    </style>
</head>
<body>
    <!-- WIDOK 1: Bezpiecznie w sieci -->
    <div class="safe_view active" id="viewMain">
        <header class="safe_topbar">
            <button type="button" class="safe_back_btn" onclick="sendTo('services')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Wróć</span>
            </button>
            <h1 class="safe_header_title">Bezpiecznie w sieci</h1>
            <span></span>
        </header>

        <main class="safe_main">
            <div class="safe_hero_icon" aria-hidden="true">
                <svg viewBox="0 0 44 44" fill="none">
                    <circle cx="20" cy="21" r="11" stroke="#e11d48" stroke-width="2.4"/>
                    <ellipse cx="20" cy="21" rx="5" ry="11" stroke="#e11d48" stroke-width="2"/>
                    <line x1="9.5" y1="18" x2="30.5" y2="18" stroke="#e11d48" stroke-width="2"/>
                    <line x1="9.5" y1="24" x2="30.5" y2="24" stroke="#e11d48" stroke-width="2"/>
                    <path d="M25 21L35 24.5V31.5C35 36.2 30.8 39.2 25 41C19.2 39.2 15 36.2 15 31.5V24.5L25 21Z" fill="#f8e3ea" stroke="#e11d48" stroke-width="2.3" stroke-linejoin="round"/>
                </svg>
            </div>

            <h2 class="safe_hero_heading">Uważaj na oszustwa</h2>
            <p class="safe_hero_subtitle">Dostajesz niepokojące wiadomości lub widzisz podejrzaną stronę? Zgłoś to!</p>

            <button type="button" class="safe_action_card" onclick="openIncidentPicker()">
                <span class="safe_plane_icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </span>
                <div>
                    <p class="safe_action_title">Zgłoś incydent</p>
                    <p class="safe_action_desc">Zgłoś zdarzenie, które narusza Twoje bezpieczeństwo w sieci.</p>
                </div>
                <span class="safe_chevron" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </span>
            </button>

            <section class="safe_info_banner" aria-label="Powiadomienia o nadużyciach">
                <span class="safe_info_icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9.5"></circle>
                        <line x1="12" y1="11" x2="12" y2="16.5"></line>
                        <circle cx="12" cy="7.5" r="0.9" fill="currentColor"></circle>
                    </svg>
                </span>
                <div>
                    <p class="safe_info_text">Chcesz być na bieżąco z aktualnymi ostrzeżeniami o nadużyciach w sieci?</p>
                    <button type="button" class="safe_link_btn" id="toggleAlertsBtn" onclick="toggleSecurityAlerts()">Włącz powiadomienia</button>
                </div>
            </section>

            <div class="safe_status_msg" id="safeStatusMsg"></div>
        </main>
    </div>

    <!-- WIDOK 2: Wybierz rodzaj incydentu -->
    <div class="safe_view" id="viewIncident">
        <header class="safe_topbar">
            <button type="button" class="safe_back_btn" onclick="openMainSafeView()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                <span>Bezpiecznie w sieci</span>
            </button>
            <span></span>
            <span></span>
        </header>

        <main class="safe_main">
            <h1 class="incident_list_heading">Wybierz rodzaj incydentu</h1>

            <section class="incident_card" aria-label="Rodzaje incydentów">
                <button type="button" class="incident_item" onclick="selectIncidentType('Złośliwa strona internetowa')">
                    <div>
                        <p class="incident_title">Złośliwa strona internetowa</p>
                        <p class="incident_desc">Próba wyłudzenia danych osobowych lub pieniędzy.</p>
                    </div>
                    <span class="safe_chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </button>

                <button type="button" class="incident_item" onclick="selectIncidentType('Podejrzany SMS')">
                    <div>
                        <p class="incident_title">Podejrzany SMS</p>
                        <p class="incident_desc">Podejrzana treść lub podejrzany nadawca.</p>
                    </div>
                    <span class="safe_chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </button>

                <button type="button" class="incident_item" onclick="selectIncidentType('Podejrzany e-mail')">
                    <div>
                        <p class="incident_title">Podejrzany e-mail</p>
                        <p class="incident_desc">Podejrzane załączniki, szantaż lub phishing.</p>
                    </div>
                    <span class="safe_chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </button>

                <button type="button" class="incident_item" onclick="selectIncidentType('Oszustwo')">
                    <div>
                        <p class="incident_title">Oszustwo</p>
                        <p class="incident_desc">Fałszywe sklepy internetowe i inne próby podszywania się pod firmy lub instytucje.</p>
                    </div>
                    <span class="safe_chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </button>

                <button type="button" class="incident_item" onclick="selectIncidentType('Inny')">
                    <div>
                        <p class="incident_title">Inny</p>
                        <p class="incident_desc">Pozostałe zdarzenia, które nie pasują do poprzednich rodzajów incydentów.</p>
                    </div>
                    <span class="safe_chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </span>
                </button>
            </section>

            <div class="safe_status_msg" id="incidentPickedMsg"></div>
        </main>
    </div>

    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services services_open"></div>
                <p class="bottom_element_text open">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        const SAFE_ALERTS_KEY = 'mobywatel_safe_alerts_enabled';

        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }

        function openIncidentPicker() {
            document.getElementById('viewMain').classList.remove('active');
            document.getElementById('viewIncident').classList.add('active');
            window.scrollTo(0, 0);
        }

        function openMainSafeView() {
            document.getElementById('viewIncident').classList.remove('active');
            document.getElementById('viewMain').classList.add('active');
            window.scrollTo(0, 0);
        }

        function syncAlertsButton() {
            const btn = document.getElementById('toggleAlertsBtn');
            let enabled = false;
            try {
                enabled = localStorage.getItem(SAFE_ALERTS_KEY) === 'true';
            } catch (e) {}

            btn.textContent = enabled ? 'Powiadomienia włączone' : 'Włącz powiadomienia';
        }

        function toggleSecurityAlerts() {
            let next = true;
            try {
                next = localStorage.getItem(SAFE_ALERTS_KEY) !== 'true';
                localStorage.setItem(SAFE_ALERTS_KEY, String(next));
            } catch (e) {}

            syncAlertsButton();
            const msg = document.getElementById('safeStatusMsg');
            msg.textContent = next
                ? 'Powiadomienia o ostrzeżeniach bezpieczeństwa w sieci zostały włączone (lokalnie).'
                : 'Powiadomienia o ostrzeżeniach bezpieczeństwa w sieci zostały wyłączone (lokalnie).';
            msg.classList.add('open');
        }

        function selectIncidentType(typeLabel) {
            const msg = document.getElementById('incidentPickedMsg');
            msg.textContent = `Wybrano kategorię: ${typeLabel}. W lokalnym prototypie zgłoszenie nie jest wysyłane na zewnętrzne serwery.`;
            msg.classList.add('open');
        }

        syncAlertsButton();
    </script>
</body>
</html>
