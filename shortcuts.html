<html>
<head>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiI2Y1ZjZmYiIsImJhY2tncm91bmRfY29sb3IiOiIjZjVmNmZiIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="stylesheet" href="assets/shortcuts.css">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/logo.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        .action_box,
        .back_text_fixed,
        .back_img_fixed {
            cursor: pointer;
        }

        .delete_modal_backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .delete_modal_backdrop.active {
            display: flex;
        }
        .delete_modal_box {
            width: 100%;
            max-width: 340px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .delete_modal_message {
            padding: 24px 20px;
            margin: 0;
            font-size: 16px;
            line-height: 1.45;
            color: #111827;
            font-weight: 500;
        }
        .delete_modal_actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 1px solid #e5e7eb;
        }
        .delete_modal_btn {
            padding: 15px 10px;
            font-size: 16px;
            font-weight: 600;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .delete_modal_btn.no_btn {
            color: #374151;
            border-right: 1px solid #e5e7eb;
        }
        .delete_modal_btn.yes_btn {
            color: #dc2626;
        }
        .delete_modal_btn:active {
            background: #f3f4f6;
        }
    </style>
</head>
<body>
    <div class="top_grid_fixed">
        <div class="action_grid_fixed" onclick="sendTo('card')">
            <img src="assets/images/back_blue.png" class="back_img_fixed">
            <p class="back_text_fixed">mDowód</p>
        </div>
        <p class="title_text_fixed">Pozostałe skróty</p>
        <img src="assets/images/help.png" class="help_img_fixed">
    </div>
    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home_open home"></div>
                <p class="bottom_element_text open">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="action_box_connected">
            <div class="action_box" style="border-bottom: 1px solid rgb(228, 228, 228);" onclick="sendTo('mandaty')">
                <img class="action_image" src="assets/images/tickets_shortcuts.png">
                <p class="action_box_text">Mandaty</p>
                <img class="action_arrow" src="assets/images/right_arrow.png">
            </div>
            <div class="action_box" onclick="sendTo('wybory')">
                <img class="action_image" src="assets/images/vote_shortcuts.png">
                <p class="action_box_text">Wybory</p>
                <img class="action_arrow" src="assets/images/right_arrow.png">
            </div>
        </div>
        <div class="delete_action">
            <div class="action_box" onclick="openDeleteModal()">
                <img class="action_image" src="assets/images/delete.png">
                <p class="action_box_text">Usuń dokument</p>
            </div>
        </div>
    </div>

    <div class="delete_modal_backdrop" id="deleteModal">
        <div class="delete_modal_box">
            <p class="delete_modal_message">Czy chcesz trwale usunąć dokument z tego urządzenia</p>
            <div class="delete_modal_actions">
                <button type="button" class="delete_modal_btn no_btn" onclick="closeDeleteModal()">Nie</button>
                <button type="button" class="delete_modal_btn yes_btn" onclick="confirmDelete()">Tak</button>
            </div>
        </div>
    </div>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }

        function openDeleteModal() {
            document.getElementById('deleteModal').classList.add('active');
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
        }

        function confirmDelete() {
            closeDeleteModal();
            sendTo('home');
        }
    </script>
</body>
</html>
