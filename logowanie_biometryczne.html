<html>
<head>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiI2Y1ZjZmYiIsImJhY2tncm91bmRfY29sb3IiOiIjZjVmNmZiIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="stylesheet" href="assets/more.css">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/logo.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body {
            background-color: #f5f6fb;
            color: #111827;
            margin: 0;
        }

        .bio_header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 18px 14px;
            background-color: #f5f6fb;
        }

        .bio_back_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
        }

        .bio_back_btn:active {
            background-color: rgba(17, 24, 39, 0.06);
        }

        .bio_title {
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            color: #111827;
            letter-spacing: -0.2px;
        }

        .bio_container {
            padding: 10px 16px 120px;
        }

        .bio_card {
            background-color: #ffffff;
            border-radius: 16px;
            padding: 18px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .bio_text_group {
            flex: 1;
            min-width: 0;
        }

        .bio_item_title {
            margin: 0 0 6px;
            font-size: 16px;
            font-weight: 600;
            color: #111827;
            line-height: 1.35;
        }

        .bio_item_desc {
            margin: 0;
            font-size: 13.5px;
            color: #4b5563;
            line-height: 1.45;
        }

        .bio_switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 30px;
            flex-shrink: 0;
        }

        .bio_switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .bio_slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #cbd5e1;
            transition: background-color 0.2s ease;
            border-radius: 999px;
        }

        .bio_slider::before {
            position: absolute;
            content: "";
            height: 24px;
            width: 24px;
            left: 3px;
            top: 3px;
            background-color: #ffffff;
            transition: transform 0.2s ease;
            border-radius: 50%;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.2);
        }

        .bio_switch input:checked + .bio_slider {
            background-color: #1d4ed8;
        }

        .bio_switch input:checked + .bio_slider::before {
            transform: translateX(22px);
        }

        .bio_switch input:focus-visible + .bio_slider {
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.2);
        }
    </style>
</head>
<body>

    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services"></div>
                <p class="bottom_element_text">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more more_open"></div>
                <p class="bottom_element_text open">Więcej</p>
            </div>
        </div>
    </div>

    <header class="bio_header">
        <button type="button" class="bio_back_btn" onclick="sendTo('more')" aria-label="Wróć">←</button>
        <h1 class="bio_title">Logowanie biometryczne</h1>
    </header>

    <main class="bio_container">
        <div class="bio_card">
            <div class="bio_text_group">
                <p class="bio_item_title">Logowanie odciskiem palca</p>
                <p class="bio_item_desc">Jeśli je wyłączysz, będziesz logować się do aplikacji hasłem.</p>
            </div>

            <label class="bio_switch" aria-label="Logowanie odciskiem palca">
                <input type="checkbox" id="fingerprintToggle" checked>
                <span class="bio_slider"></span>
            </label>
        </div>
    </main>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        const STORAGE_KEY = 'mobywatel_biometric_login';
        const toggleEl = document.getElementById('fingerprintToggle');

        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }

        try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                toggleEl.checked = saved === 'true';
            }
        } catch (e) {}

        toggleEl.addEventListener('change', () => {
            try {
                localStorage.setItem(STORAGE_KEY, String(toggleEl.checked));
            } catch (e) {}
        });
    </script>
</body>
</html>
