<!DOCTYPE html>
<html lang="pl">
<head>
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiIiwic2hvcnRfbmFtZSI6IiIsInRoZW1lX2NvbG9yIjoiI2Y1ZjZmYiIsImJhY2tncm91bmRfY29sb3IiOiIjZjVmNmZiIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
    <title>mObywatel</title>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="assets/main.css">
    <link rel="icon" type="image/x-icon" href="assets/images/logo.png">
    <link rel="apple-touch-icon" href="assets/images/logo.png">
    <link rel="shortcut icon" href="assets/images/logo.png">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=0.8, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #f6f7fb;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        .vehicle_header {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px 10px;
            background-color: #f6f7fb;
        }

        .vehicle_back_btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            border-radius: 50%;
        }

        .vehicle_back_btn:active {
            background-color: rgba(17, 24, 39, 0.06);
        }

        .vehicle_title {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
        }

        .vehicle_container {
            max-width: 460px;
            margin: 0 auto;
            padding: 6px 16px 128px;
            box-sizing: border-box;
        }

        .vehicle_hero_heading {
            margin: 8px 0 12px;
            text-align: center;
            font-size: 27px;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -0.4px;
            color: #111827;
        }

        .vehicle_hero_desc {
            margin: 0 auto 22px;
            max-width: 340px;
            text-align: center;
            font-size: 14.5px;
            line-height: 1.45;
            color: #4b5563;
        }

        .vehicle_form_card {
            background-color: #ffffff;
            border-radius: 18px;
            padding: 20px 18px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }

        .vehicle_field {
            margin-bottom: 16px;
        }

        .vehicle_field:last-of-type {
            margin-bottom: 0;
        }

        .vehicle_label {
            display: block;
            margin-bottom: 8px;
            font-size: 13.5px;
            font-weight: 500;
            color: #374151;
        }

        .vehicle_input {
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #e2e6ef;
            border-radius: 10px;
            background-color: #ffffff;
            color: #111827;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.4px;
            box-sizing: border-box;
            outline: none;
        }

        .vehicle_input::placeholder {
            color: #4b5563;
            opacity: 0.9;
        }

        .vehicle_input:focus {
            border-color: #0b4da2;
        }

        .vehicle_hint {
            margin: 8px 0 0;
            font-size: 12px;
            line-height: 1.4;
            color: #6b7280;
        }

        .vehicle_submit_btn {
            margin-top: 16px;
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 999px;
            background-color: #0b4da2;
            color: #ffffff;
            font-size: 15.5px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(11, 77, 162, 0.16);
        }

        .vehicle_submit_btn:active {
            background-color: #093d80;
        }

        .vehicle_preview_box {
            display: none;
            margin-top: 14px;
            background-color: #ffffff;
            border-radius: 16px;
            padding: 14px 16px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
            border-left: 4px solid #0b4da2;
            font-size: 13.5px;
            line-height: 1.48;
            color: #374151;
        }

        .vehicle_preview_box.open {
            display: block;
        }
    </style>
</head>
<body>
    <header class="vehicle_header">
        <button type="button" class="vehicle_back_btn" onclick="sendTo('services')" aria-label="Wróć">←</button>
        <h1 class="vehicle_title">Historia pojazdu</h1>
    </header>

    <div class="bottom_bar" style="height: 85px;">
        <div class="bottom_bar_grid">
            <div class="bottom_element_grid" send="home">
                <div class="bottom_element_image home"></div>
                <p class="bottom_element_text">Pulpit</p>
            </div>
            <div class="bottom_element_grid" send="documents">
                <div class="bottom_element_image documents"></div>
                <p class="bottom_element_text">Dokumenty</p>
            </div>
            <div class="bottom_element_grid" send="services">
                <div class="bottom_element_image services services_open"></div>
                <p class="bottom_element_text open">Usługi</p>
            </div>
            <div class="bottom_element_grid" send="qr">
                <div class="bottom_element_image qr"></div>
                <p class="bottom_element_text">Kod QR</p>
            </div>
            <div class="bottom_element_grid" send="more">
                <div class="bottom_element_image more"></div>
                <p class="bottom_element_text">Więcej</p>
            </div>
        </div>
    </div>

    <main class="vehicle_container">
        <h2 class="vehicle_hero_heading">Poznaj historię pojazdu</h2>
        <p class="vehicle_hero_desc">
            Sprawdź dane techniczne, odczyty licznika, liczbę dotychczasowych właścicieli i inne ważne informacje.
        </p>

        <form class="vehicle_form_card" onsubmit="handleVehicleCheck(event)">
            <div class="vehicle_field">
                <label class="vehicle_label" for="regNumber">Numer rejestracyjny</label>
                <input
                    type="text"
                    id="regNumber"
                    class="vehicle_input"
                    placeholder="POXXXXX"
                    autocomplete="off"
                >
            </div>

            <div class="vehicle_field">
                <label class="vehicle_label" for="vinNumber">Numer VIN</label>
                <input
                    type="text"
                    id="vinNumber"
                    class="vehicle_input"
                    placeholder="ABC12345678912"
                    autocomplete="off"
                >
                <p class="vehicle_hint">Numer VIN znajdziesz w dowodzie rejestracyjnym w polu E.</p>
            </div>

            <button type="submit" class="vehicle_submit_btn">Sprawdź pojazd</button>
        </form>

        <div class="vehicle_preview_box" id="vehiclePreviewBox"></div>
    </main>

    <script src="assets/bar.js"></script>
    <script src="assets/manifest.js"></script>
    <script src="assets/cache.js"></script>
    <script>
        function sendTo(page) {
            const query = window.location.search;
            location.href = query ? `${page}.html${query}` : `${page}.html`;
        }

        function handleVehicleCheck(event) {
            event.preventDefault();
            const regVal = document.getElementById('regNumber').value.trim().toUpperCase() || 'POXXXXX';
            const vinVal = document.getElementById('vinNumber').value.trim().toUpperCase() || 'ABC12345678912';
            const box = document.getElementById('vehiclePreviewBox');

            box.textContent = `Wprowadzono numer rejestracyjny: ${regVal} oraz VIN: ${vinVal}. W lokalnym prototypie zapytanie do zewnętrznej bazy nie jest wysyłane.`;
            box.classList.add('open');
        }
    </script>
</body>
</html>
